name: Build Tempo packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: Tempo-macOS
          - name: Windows
            os: windows-latest
            artifact: Tempo-Windows
          - name: Linux
            os: ubuntu-latest
            artifact: Tempo-Linux

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use the stable Rust toolchain
        run: rustup update stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            fakeroot \
            dpkg-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Cargo Make and cargo-bundle
        run: |
          cargo install cargo-make --locked
          cargo install cargo-bundle --locked

      - name: Build native Windows executable
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Build native Tempo package
        if: runner.os != 'Windows'
        run: cargo make bundle-host

      - name: Prepare macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/osx/Tempo.app \
            release-assets/Tempo-macOS.zip

      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item target/release/task-tracker.exe release-assets/Tempo-Windows.exe

      - name: Prepare Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          package="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          cp "$package" release-assets/Tempo-Linux.deb

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Tempo $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            ${{ contains(github.ref_name, '-rc.') && '--prerelease' || '' }}
