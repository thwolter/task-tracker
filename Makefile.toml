[tasks.slint]
env = { SLINT_LIVE_PREVIEW = "1" }
command = "cargo"
args = ["run", "--features", "live-preview"]

[tasks.extract-translations]
script = '''
find . -name '*.slint' -print0 | xargs -0 slint-tr-extractor -o tempo.pot
'''

[tasks.update-translations]
dependencies = ["extract-translations"]
script = '''
msgmerge --update --no-fuzzy-matching --backup=none \
  translations/de/LC_MESSAGES/Tempo.po tempo.pot
msgfmt --check translations/de/LC_MESSAGES/Tempo.po
'''

[tasks.bundle-host]
script = '''
cargo test --release
cargo bundle --release
'''

[tasks.bundle-linux]
condition = { platforms = ["mac"] }
script = '''
docker build --platform linux/amd64 -t stride-linux-builder -f Dockerfile.linux .
mkdir -p target-linux
docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" -v "$(pwd):/work" -v "$(pwd)/target-linux:/out" -e CARGO_TARGET_DIR=/out stride-linux-builder bash -lc 'cargo test --release && cargo bundle --release'
'''

[tasks.inspect-linux]
condition = { platforms = ["mac"] }
script = '''
docker run --rm -v "$(pwd)/target-linux:/out:ro" debian:bookworm-slim sh -c 'dpkg-deb --info /out/release/bundle/deb/*.deb && dpkg-deb --contents /out/release/bundle/deb/*.deb'
'''

[tasks.format-slint]
script = '''
find . -type f -name "*.slint" -exec slint-lsp format -i {} \;
'''

[tasks.release]
description = "Prepare a new release: cargo make release 0.4.0"
script_runner = "@duckscript"
script = '''
version = exec git cliff --bumped-version
version = trim ${version.stdout}
version = substring ${version} 1

echo "Preparing release v${version}"

exec --fail-on-error cargo set-version ${version}

if is_file CHANGELOG.md
    exec --fail-on-error git cliff --unreleased --tag v${version} --prepend CHANGELOG.md
else
    exec --fail-on-error git cliff --unreleased --tag v${version} --output CHANGELOG.md
end

exec --fail-on-error cargo check
exec --fail-on-error cargo test

exec --fail-on-error git add Cargo.toml Cargo.lock CHANGELOG.md
exec --fail-on-error git commit -m "chore(release): v${version}"
exec --fail-on-error git tag v${version}

echo "Release v${version} prepared."
echo "Push with: git push && git push --tags"
'''
