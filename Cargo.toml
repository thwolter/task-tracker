[package]
name = "task-tracker"
version = "0.2.0"
description = "A minimalist desktop app for focused task tracking and work sessions."
edition = "2024"
authors = ["Thomas Wolter"]
homepage = "https://github.com/thwolter/task-tracker"

[dependencies]
slint = "1.17.1"
sys-locale = "0.3.2"
chrono = { version = "0.4", default-features = true }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1"

[package.metadata.bundle]
name = "Tempo"
identifier = "io.github.thwolter.task-tracker"
icon = [
    "resources/icons/icon_16x16.png",
    "resources/icons/icon_16x16@2x.png",
    "resources/icons/icon_32x32.png",
    "resources/icons/icon_32x32@2x.png",
    "resources/icons/icon_128x128.png",
    "resources/icons/icon_128x128@2x.png",
    "resources/icons/icon_256x256.png",
    "resources/icons/icon_256x256@2x.png",
    "resources/icons/icon_512x512.png",
    "resources/icons/icon_512x512@2x.png",
]
short_description = "Stay focused, track progress, move work forward."
long_description = "Tempo helps users organize projects, choose what to work on next, track focused work sessions, add progress notes, and review completed work."
copyright = "Copyright (c) Thomas Wolter. All rights reserved."
category = "Productivity"

[profile.release]
codegen-units = 1
lto = true
