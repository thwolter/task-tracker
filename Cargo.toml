[package]
name = "task-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.17.1"
chrono = { version = "0.4", default-features = true }
rfd = "0.15.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

[profile.release]
codegen-units = 1
lto = true
