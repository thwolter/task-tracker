[package]
name = "Tempo"
version = "0.4.1"
description = "A minimalist desktop app for focused task tracking and work sessions."
edition = "2024"
authors = ["Thomas Wolter"]
homepage = "https://github.com/thwolter/task-tracker"

[features]
live-preview = ["slint/live-preview"]

[dependencies]
slint = "1.18.0"
sys-locale = "0.3.2"
chrono = { version = "0.4", default-features = true }
csv = "1.3"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
single-instance = "0.3.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
fs2 = "0.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
i-slint-backend-winit = "1.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }
i-slint-backend-winit = "1.17.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }

[dev-dependencies]
i-slint-backend-testing = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1"

[package.metadata.bundle]
name = "Tempo"
identifier = "io.github.thwolter.task-tracker"
icon = ["resources/icon.icns"]
short_description = "Stay focused, track progress, move work forward."
long_description = "Tempo helps users organize projects, choose what to work on next, track focused work sessions, add progress notes, and review completed work."
copyright = "Copyright (c) Thomas Wolter. All rights reserved."
category = "Productivity"

[profile.release]
codegen-units = 1
lto = true
